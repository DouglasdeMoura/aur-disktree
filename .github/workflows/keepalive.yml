name: Keepalive

# GitHub disables a repository's scheduled workflows after 60 days without
# repository activity. Releases are irregular, so push an empty commit once
# a month to keep the hourly AUR sync alive.

on:
  schedule:
    - cron: "0 4 12 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty \
            -m "chore: keepalive (scheduled workflows are disabled after 60 days of inactivity)"
          git push
